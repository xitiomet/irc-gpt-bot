<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>IRC GPT Bot Manager</title>
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="theme.css">
    <script src="index.js"></script>
</head>
<body class="dashboard">
    <header class="app-header">
        <a href="./" id="serverTitle" class="brand">
            <img src="icon-32.png" alt="" width="32" height="32">
            <span>IRC GPT <span class="brand-secondary">Bot Manager</span></span>
        </a>
        <span id="connectionState" class="connection-state" role="status">Connecting...</span>
        <button onclick="masterConfigWindow()" id="masterConfigButton" style="display: none;">Master Config</button>
        <button onclick="launchBotWindow()" id="launchBotButton" class="primary" style="display: none;">Launch Bot</button>
    </header>
    <main>
        <section id="login" class="login-section">
            <form class="login-card" onsubmit="event.preventDefault(); doAuth();">
                <span class="eyebrow">YOUR IRC WORKSPACE</span>
                <h1>Welcome back.</h1>
                <p class="help">Sign in to manage your bots, conversations, and AI tools.</p>
                <label for="password">API password</label>
                <input type="password" name="password" id="password" autocomplete="current-password" required>
                <p id="errorMsg" class="error-message" role="alert"></p>
                <button id="login_btn" type="submit" class="primary">Sign in</button>
            </form>
        </section>
        <section id="console" class="workspace" style="display: none;">
            <div class="workspace-heading">
                <div>
                    <span class="eyebrow">WORKSPACE</span>
                    <h1>Your bots</h1>
                    <p class="help">Connections, activity, and AI usage at a glance.</p>
                </div>
                <span id="botCount" class="count-badge">0 bots</span>
            </div>
            <div id="botTable" class="bot-grid"></div>
            <div id="emptyBots" class="empty-state">
                <h2>A fresh start.</h2>
                <p class="help">Launch your first bot to connect to IRC and start a conversation.</p>
                <button onclick="launchBotWindow()" class="primary">Launch Bot</button>
            </div>
        </section>
    </main>
    <dialog id="editorDialog" aria-labelledby="editorTitle">
        <div class="editorHeader">
            <h2 id="editorTitle">Editor</h2>
            <button type="button" id="closeEditorButton" aria-label="Close editor">Close</button>
        </div>
        <iframe id="editorFrame" title="Editor" src="about:blank" referrerpolicy="no-referrer"></iframe>
    </dialog>
</body>
</html>
