<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Channels</title>
    <script src="jquery.min.js"></script>
    <script src="editor.js"></script>
    <script type="text/javascript">
        var parameters = new URLSearchParams(window.location.search);
        var botUrl = '/ircgptbot/api/bot/' + encodeURIComponent(parameters.get('id')) + '/';
        var connected = false;
        var busy = false;
        var refreshTimer;
        var channelNames = [];
        var selectedChannel = null;
        var detailTimer;
        var viewVersion = 0;
        var messagesVersion = '';
        var rosterVersion = '';

        function openChannel(name)
        {
            selectedChannel = name;
            viewVersion++;
            messagesVersion = '';
            rosterVersion = '';
            document.getElementById('channelList').hidden = true;
            document.getElementById('channelView').hidden = false;
            document.getElementById('viewTitle').textContent = name;
            document.getElementById('topic').textContent = 'Loading topic...';
            document.getElementById('messages').textContent = '';
            document.getElementById('roster').textContent = '';
            document.getElementById('viewStatus').textContent = 'Loading channel...';
            document.getElementById('setOperator').hidden = true;
            refreshChannelView();
        }

        function backToChannels()
        {
            selectedChannel = null;
            viewVersion++;
            clearTimeout(detailTimer);
            document.getElementById('channelList').hidden = false;
            document.getElementById('channelView').hidden = true;
        }

        function renderChannelView(channel)
        {
            document.getElementById('topic').textContent = channel.topic || '(No topic)';
            document.getElementById('setOperator').hidden = !channel.botIsOp;
            var messageList = document.getElementById('messages');
            var version = JSON.stringify(channel.messages);
            if (version !== messagesVersion)
            {
                var atBottom = messageList.scrollHeight - messageList.scrollTop - messageList.clientHeight < 40;
                var scroll = messageList.scrollTop;
                var initial = messagesVersion === '';
                messageList.textContent = '';
                channel.messages.forEach(function(message) {
                    var row = document.createElement('li');
                    var time = document.createElement('time');
                    time.dateTime = new Date(message.timestamp).toISOString();
                    time.textContent = new Date(message.timestamp).toLocaleTimeString();
                    var sender = document.createElement('strong');
                    sender.textContent = message.sender;
                    var text = document.createElement('span');
                    text.textContent = message.body;
                    row.appendChild(time);
                    row.appendChild(sender);
                    row.appendChild(text);
                    messageList.appendChild(row);
                });
                messagesVersion = version;
                messageList.scrollTop = initial || atBottom ? messageList.scrollHeight : scroll;
            }
            document.getElementById('emptyMessages').hidden = channel.messages.length !== 0;
            var roster = document.getElementById('roster');
            version = JSON.stringify(channel.roster);
            if (version !== rosterVersion)
            {
                roster.textContent = '';
                channel.roster.forEach(function(user) {
                    var row = document.createElement('li');
                    row.textContent = user.prefix + user.nickname;
                    roster.appendChild(row);
                });
                rosterVersion = version;
            }
            document.getElementById('rosterTitle').textContent = 'Roster (' + channel.roster.length + ')';
            document.getElementById('viewStatus').textContent = channel.rosterComplete ? 'Live updates every 2 seconds.' : 'Loading roster from IRC...';
            if (channel.historyTruncated)
                document.getElementById('viewStatus').textContent += ' Earlier history omitted (showing up to 10,000 messages from the latest 16 MiB of today\'s log).';
            if (channel.historyError)
                document.getElementById('viewStatus').textContent += ' ' + channel.historyError;
        }

        function refreshChannelView()
        {
            clearTimeout(detailTimer);
            if (selectedChannel == null)
                return;
            var name = selectedChannel;
            var version = viewVersion;
            $.ajax({
                url: botUrl + 'channel/',
                data: { name: name },
                dataType: 'json', cache: false, timeout: 10000
            }).done(function(json) {
                if (name !== selectedChannel || version !== viewVersion)
                    return;
                if (json.error || !json.channel)
                {
                    document.getElementById('viewStatus').textContent = json.error || 'Channel unavailable.';
                    document.getElementById('topic').textContent = '(Channel unavailable)';
                    document.getElementById('roster').textContent = '';
                    document.getElementById('setOperator').hidden = true;
                    rosterVersion = '';
                    return;
                }
                renderChannelView(json.channel);
            }).fail(function() {
                if (name === selectedChannel && version === viewVersion)
                    document.getElementById('viewStatus').textContent = 'Unable to update channel. Retrying...';
            }).always(function() {
                if (name === selectedChannel && version === viewVersion)
                    detailTimer = setTimeout(refreshChannelView, 2000);
            });
        }

        function setStatus(message)
        {
            document.getElementById('status').textContent = message;
        }

        function updateButtons()
        {
            document.querySelectorAll('button').forEach(function(button) {
                button.disabled = button.id === 'backToChannels' ? false : busy || !connected;
            });
        }

        function renderChannels(channels)
        {
            var list = document.getElementById('channels');
            list.textContent = '';
            if (channels.length == 0)
                list.textContent = 'The bot is not in any channels.';
            channels.forEach(function(channel) {
                var row = document.createElement('li');
                var name = document.createElement('button');
                name.textContent = channel;
                name.className = 'channel-link';
                name.onclick = function() { openChannel(channel); };
                var leave = document.createElement('button');
                leave.textContent = 'Leave';
                leave.onclick = function() {
                    if (confirm('Leave ' + channel + '?'))
                        channelAction('part', channel);
                };
                row.appendChild(name);
                row.appendChild(leave);
                list.appendChild(row);
            });
            updateButtons();
        }

        function refreshChannels()
        {
            clearTimeout(refreshTimer);
            $.ajax({
                url: botUrl,
                dataType: 'json',
                cache: false,
                timeout: 10000
            }).done(function(json) {
                if (json.error || !json.bot || !Array.isArray(json.bot.channels))
                {
                    connected = false;
                    document.getElementById('connectionStatus').textContent = json.error || 'Bot unavailable or invalid channel list.';
                    updateButtons();
                    return;
                }
                connected = json.bot.status == 'CONNECTED';
                document.getElementById('botTitle').textContent = json.bot.id + ' - Channels';
                document.getElementById('connectionStatus').textContent = connected ? '' : 'The bot is not connected.';
                var channels = json.bot.channels.slice().sort();
                if (JSON.stringify(channels) != JSON.stringify(channelNames) || !document.getElementById('channels').hasChildNodes())
                {
                    channelNames = channels;
                    renderChannels(channels);
                }
                updateButtons();
            }).fail(function() {
                connected = false;
                document.getElementById('connectionStatus').textContent = 'Unable to load channels. Retrying...';
                updateButtons();
            }).always(function() {
                refreshTimer = setTimeout(refreshChannels, 2000);
            });
        }

        function channelAction(action, channel, nickname)
        {
            if (busy || !connected)
            {
                setStatus('Wait for the bot to be connected and the current request to finish.');
                return;
            }
            channel = channel.trim();
            if (!/^[#&+!][^\s,\x00\x07:]+$/.test(channel))
            {
                setStatus('Enter a channel name such as #lobby.');
                return;
            }
            busy = true;
            updateButtons();
            setStatus('Sending request...');
            $.ajax({
                url: botUrl + 'channels/',
                type: 'POST',
                data: JSON.stringify({
                    action: action,
                    channel: channel,
                    nickname: nickname
                }),
                contentType: 'application/json; charset=utf-8',
                dataType: 'json',
                timeout: 10000
            }).done(function(json) {
                if (json.error || !json.bot)
                {
                    setStatus(json.error || 'Bot unavailable.');
                    if (action == 'op')
                        document.getElementById('viewStatus').textContent = json.error || 'Bot unavailable.';
                    return;
                }
                if (action == 'op')
                {
                    document.getElementById('viewStatus').textContent = 'Operator status requested for ' + nickname + ' in ' + channel + '.';
                    return;
                }
                setStatus((action == 'join' ? 'Join' : 'Leave') + ' requested for ' + channel + '. The list updates when the IRC server responds.');
                if (action == 'join')
                    document.getElementById('channelName').value = '';
            }).fail(function() {
                setStatus('Unable to complete the request. Check the channel list before retrying.');
            }).always(function() {
                busy = false;
                updateButtons();
            });
        }

        function loaded()
        {
            document.getElementById('backToChannels').onclick = backToChannels;
            document.getElementById('setOperator').onclick = function() {
                var nickname = prompt('Give operator status in ' + selectedChannel + ' to which nickname?');
                if (nickname && nickname.trim())
                    channelAction('op', selectedChannel, nickname.trim());
            };
            document.getElementById('joinForm').onsubmit = function(event) {
                event.preventDefault();
                channelAction('join', document.getElementById('channelName').value);
            };
            refreshChannels();
        }
    </script>
    <link rel="stylesheet" href="theme.css">
</head>
<body onload="loaded()" class="editor-page">
    <h2 id="botTitle">Channels</h2>
    <p id="connectionStatus" role="status">Loading channels...</p>
    <div id="channelList">
    <p class="help">Click a channel to view its messages, topic, and roster.</p>
    <ul id="channels"></ul>
    <form id="joinForm" class="form-panel">
        <label for="channelName">Join a channel</label>
        <div class="join-controls">
            <input id="channelName" type="text" placeholder="#lobby" required autocomplete="off">
            <button type="submit" class="primary" disabled>Join</button>
        </div>
    </form>
    </div>
    <section id="channelView" hidden>
        <div class="toolbar"><button type="button" id="backToChannels">Back to channels</button><h3 id="viewTitle"></h3><button type="button" id="setOperator" hidden>Set Operator</button></div>
        <div class="form-panel channel-topic"><strong>Topic</strong><p id="topic"></p></div>
        <div class="channel-layout">
            <section class="channel-transcript" aria-label="Channel messages">
                <ol id="messages"></ol>
                <p id="emptyMessages" class="help" hidden>No messages observed yet. Showing up to 255 recent messages since this bot started.</p>
            </section>
            <aside class="channel-roster"><h3 id="rosterTitle">Roster</h3><ul id="roster"></ul></aside>
        </div>
        <p id="viewStatus" role="status" class="help"></p>
    </section>
    <p id="status" role="status"></p>
</body>
</html>
